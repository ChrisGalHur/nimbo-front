<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>Nimbo · Tu diagnóstico</title>

  <link
          href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
          rel="stylesheet"
  >

  <style>

    :root {
      --bg:#0A0F1C;
      --panel:#10182B;
      --input:#0F1526;
      --ink:#EAF2FF;
      --ink-soft:#7C8CB3;
      --line:#1E2B45;
      --cyan:#5CE1E6;
      --blue:#5C86FF;
      --good:#5FE3A3;
      --warn:#FFC163;
      --bad:#FF6B6B;

      --brand-ink:#EAF2FF;
    }


    * {
      box-sizing:border-box;
    }


    html {
      min-height:100%;
    }


    body {
      margin:0;

      background:var(--bg);
      color:var(--ink);

      font-family:'Inter',sans-serif;
      font-size:14px;

      padding:32px;

      transition:
        background .25s ease,
        color .25s ease;
    }


    /* ---------------------------------------------------------
       Main layout
       --------------------------------------------------------- */

    .wrap {
      max-width:600px;
      margin:0 auto;

      position:relative;
    }


    /* ---------------------------------------------------------
       Permanent top area
       --------------------------------------------------------- */

    .wrap::before {
      content:"";

      position:absolute;

      z-index:-1;

      top:-32px;

      left:50%;

      transform:translateX(-50%);

      width:100vw;

      height:140px;

      background:#0A0F1C;

      pointer-events:none;

      transition:
        background .25s ease;
    }


    /* ---------------------------------------------------------
       Header
       --------------------------------------------------------- */

    .topbar {
      display:flex;

      justify-content:space-between;
      align-items:center;

      margin-bottom:32px;
    }


    /* ---------------------------------------------------------
       Nimbo brand
       --------------------------------------------------------- */

    .brand {
      display:flex;

      align-items:center;

      gap:9px;

      padding:0;

      text-decoration:none;
    }


    .brand-mark {
      width:28px;
      height:28px;

      display:flex;

      align-items:center;
      justify-content:center;

      flex-shrink:0;
    }


    .brand-mark svg {
      display:block;

      width:28px;
      height:28px;
    }


    .brand-word {
      font-family:'Space Grotesk',sans-serif;

      font-weight:700;

      font-size:16px;

      letter-spacing:.1em;

      color:var(--brand-ink);
    }


    .brand-word .accent {
      color:#5CE1E6;
    }


    /* ---------------------------------------------------------
       Theme toggle
       --------------------------------------------------------- */

    .theme-toggle {
      width:34px;
      height:34px;

      padding:0;

      border:1px solid rgba(234,242,255,.18);

      border-radius:9px;

      background:rgba(255,255,255,.04);

      display:flex;

      align-items:center;
      justify-content:center;

      cursor:pointer;

      color:#EAF2FF;

      font-size:17px;

      line-height:1;

      transition:
        border-color .2s ease,
        background .2s ease,
        color .2s ease,
        transform .2s ease;
    }


    .theme-toggle:hover {
      border-color:#5CE1E6;

      background:rgba(92,225,230,.08);

      color:#5CE1E6;

      transform:scale(1.03);
    }


    /* ---------------------------------------------------------
       Score card
       --------------------------------------------------------- */

    .score-card {
      background:var(--panel);

      border:1px solid var(--line);

      border-radius:14px;

      padding:26px 28px;

      display:flex;

      align-items:center;

      gap:18px;

      margin-bottom:18px;

      box-shadow:
        0 12px 36px rgba(0,0,0,.08);
    }


    .ring-num {
      font-family:'IBM Plex Mono',monospace;

      font-size:28px;

      font-weight:600;

      color:var(--ink);

      text-shadow:
        0 0 5px rgba(92,225,230,.6),
        0 0 18px rgba(92,134,255,.4);
    }


    .score-status {
      font-size:14px;

      font-weight:700;
    }


    .score-label {
      font-size:12px;

      color:var(--ink-soft);

      margin-top:2px;
    }


    /* ---------------------------------------------------------
       Diagnosis
       --------------------------------------------------------- */

       .diagnosis-panel {
  background:var(--panel);

  border:1px solid var(--line);

  border-radius:14px;

  padding:24px 26px;

  margin:0 0 18px;

  box-shadow:
    0 12px 36px rgba(0,0,0,.08);
}


.diagnosis-title {
  font-family:'Space Grotesk',sans-serif;

  font-size:13px;

  font-weight:700;

  color:var(--ink-soft);

  text-transform:uppercase;

  letter-spacing:.05em;

  margin:0 0 4px;
}


.diagnosis-subtitle {
  font-size:12px;

  color:var(--ink-soft);

  margin:0 0 18px;

  opacity:.8;
}


.diagnosis-item {
  padding:15px 0;

  border-top:1px solid var(--line);
}


.diagnosis-item:first-of-type {
  border-top:none;

  padding-top:0;
}


.diagnosis-label {
  font-family:'Space Grotesk',sans-serif;

  font-size:13px;

  font-weight:600;

  color:var(--cyan);

  margin-bottom:6px;
}


.diagnosis-item p {
  font-size:13.5px;

  line-height:1.65;

  color:var(--ink);

  margin:0;
}


body.light .diagnosis-panel {
  box-shadow:
    0 14px 36px rgba(38,83,145,.10);
}


    /* ---------------------------------------------------------
       Generic panel
       --------------------------------------------------------- */

    .panel {
      background:var(--panel);

      border:1px solid var(--line);

      border-radius:14px;

      padding:26px 28px;

      margin-bottom:18px;

      box-shadow:
        0 12px 36px rgba(0,0,0,.08);
    }


    .panel h3 {
      font-family:'Space Grotesk',sans-serif;

      font-size:13px;

      font-weight:700;

      margin:0 0 12px;

      color:var(--ink-soft);

      text-transform:uppercase;

      letter-spacing:.04em;
    }


    /* ---------------------------------------------------------
       Breakdown table
       --------------------------------------------------------- */

    table {
      width:100%;

      border-collapse:collapse;
    }


    td {
      padding:9px 0;

      font-size:13px;

      border-top:1px solid var(--line);
    }


    td.num {
      text-align:right;

      font-family:'IBM Plex Mono',monospace;

      font-weight:600;
    }


    .status-dot {
      width:7px;
      height:7px;

      border-radius:50%;

      display:inline-block;

      margin-right:7px;
    }


    /* ---------------------------------------------------------
       Upsell
       --------------------------------------------------------- */

    .upsell {
      background:
        linear-gradient(
          135deg,
          rgba(92,225,230,.08),
          rgba(92,134,255,.08)
        );

      border:1px solid var(--line);

      border-radius:14px;

      padding:24px 26px;

      margin-bottom:16px;
    }


    .upsell h3 {
      font-family:'Space Grotesk',sans-serif;

      font-size:17px;

      font-weight:600;

      margin:0 0 10px;
    }


    .upsell p {
      font-size:13.5px;

      color:var(--ink-soft);

      line-height:1.55;

      margin:0 0 16px;
    }


    .upsell ul {
      margin:0 0 20px;

      padding-left:0;

      list-style:none;
    }


    .upsell li {
      font-size:13.5px;

      padding:7px 0;

      display:flex;

      gap:8px;
    }


    .upsell li::before {
      content:"✓";

      color:var(--good);

      font-weight:700;
    }


    /* ---------------------------------------------------------
       Primary CTA
       --------------------------------------------------------- */

    .cta {
      display:block;

      width:100%;

      background:var(--cyan);

      color:#0A0F1C;

      border:none;

      border-radius:12px;

      padding:15px;

      font-size:15px;

      font-weight:700;

      font-family:'Inter',sans-serif;

      cursor:pointer;

      text-align:center;

      text-decoration:none;

      box-shadow:
        0 0 24px rgba(92,225,230,.28);

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        filter .15s ease;
    }


    .cta:hover {
      transform:translateY(-1px);

      box-shadow:
        0 0 30px rgba(92,225,230,.40);

      filter:brightness(1.04);
    }


    .cta:active {
      transform:translateY(0);
    }


    .cta-note {
      text-align:center;

      font-size:12px;

      color:var(--ink-soft);

      margin-top:10px;
    }


    /* ---------------------------------------------------------
       Promo code
       --------------------------------------------------------- */

    .code-wrap {
      margin-top:18px;

      text-align:center;
    }


    .code-label {
      font-size:11.5px;

      color:var(--ink-soft);

      opacity:.7;

      margin-bottom:6px;
    }


    .code-row {
      display:flex;

      gap:8px;

      max-width:260px;

      margin:0 auto;
    }


    .code-input {
      flex:1;

      background:transparent;

      border:1px solid var(--line);

      border-radius:8px;

      padding:8px 11px;

      color:var(--ink);

      font-size:13px;

      font-family:'Inter',sans-serif;

      outline:none;

      transition:
        border-color .2s ease,
        background .2s ease;
    }


    .code-input::placeholder {
      color:var(--ink-soft);

      opacity:.6;
    }


    .code-input:focus {
      border-color:var(--cyan);

      background:var(--input);
    }


    .code-btn {
      background:transparent;

      border:1px solid var(--line);

      border-radius:8px;

      padding:8px 12px;

      color:var(--ink-soft);

      font-size:12px;

      cursor:pointer;

      white-space:nowrap;

      transition:
        border-color .2s ease,
        color .2s ease,
        background .2s ease;
    }


    .code-btn:hover {
      border-color:var(--cyan);

      color:var(--cyan);

      background:rgba(92,225,230,.06);
    }


    /* ---------------------------------------------------------
       Loading
       --------------------------------------------------------- */

    .loading {
      color:var(--ink-soft);

      font-size:13px;
    }


    /* ---------------------------------------------------------
       Light theme
       --------------------------------------------------------- */

    body.light {
      --bg:#EAF4FF;

      --panel:#DCEBFF;

      --input:#F4F8FF;

      --ink:#162039;

      --ink-soft:#5D7194;

      --line:#BED1EE;
    }


    body.light .wrap::before {
      background:#0A0F1C;
    }


    body.light .brand-word {
      color:#EAF2FF;
    }


    body.light .brand-word .accent {
      color:#5CE1E6;
    }


    body.light .theme-toggle {
      border-color:rgba(234,242,255,.18);

      background:rgba(255,255,255,.04);

      color:#EAF2FF;
    }


    body.light .score-card,
    body.light .panel {
      box-shadow:
        0 14px 36px rgba(38,83,145,.10);
    }


    body.light .upsell {
      box-shadow:
        0 14px 36px rgba(38,83,145,.08);
    }


    body.light .code-input:focus {
      background:#FFFFFF;
    }


    /* ---------------------------------------------------------
       Responsive
       --------------------------------------------------------- */

    @media(max-width:600px) {

      body {
        padding:20px;
      }


      .wrap::before {
        top:-20px;

        height:140px;
      }


      .score-card {
        padding:22px 20px;
      }


      .panel {
        padding:22px 20px;
      }


      .upsell {
        padding:22px 20px;
      }


      .code-row {
        max-width:100%;
      }

    }

  </style>

</head>


<body>

<div class="wrap">


  <!-- Header -->

  <div class="topbar">


    <!-- Nimbo brand -->

    <div class="brand">

      <div class="brand-mark">

        <svg
                viewBox="0 0 64 64"
                aria-hidden="true"
        >

          <defs>

            <filter
                    id="logoGlow"
                    x="-60%"
                    y="-60%"
                    width="220%"
                    height="220%"
            >

              <feGaussianBlur
                      stdDeviation="1.4"
                      result="blur"
              />

              <feMerge>

                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />

              </feMerge>

            </filter>

          </defs>


          <circle
                  cx="32"
                  cy="32"
                  r="10"
                  fill="none"
                  stroke="#5CE1E6"
                  stroke-width="2.6"
                  filter="url(#logoGlow)"
          />


          <circle
                  cx="32"
                  cy="32"
                  r="18"
                  fill="none"
                  stroke="#5C86FF"
                  stroke-width="2"
                  filter="url(#logoGlow)"
                  opacity=".85"
          />


          <circle
                  cx="32"
                  cy="32"
                  r="26"
                  fill="none"
                  stroke="#5C86FF"
                  stroke-width="1.4"
                  filter="url(#logoGlow)"
                  opacity=".45"
          />

        </svg>

      </div>


      <span class="brand-word">
        NIM<span class="accent">B</span>O
      </span>

    </div>


    <!-- Theme -->

    <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            onclick="toggleTheme()"
            title="Cambiar tema"
    >
      ☀︎
    </button>

  </div>


  <!-- Content -->

  <div id="content">

    <p class="loading">
      Cargando tus datos...
    </p>

  </div>


</div>


<script src="config.js"></script>


<script>

  //region Theme

  function applyTheme() {

    const savedTheme =
      localStorage.getItem('nimboTheme');

    const isLight =
      savedTheme === 'light';


    document.body.classList.toggle(
      'light',
      isLight
    );


    const button =
      document.getElementById(
        'themeToggle'
      );


    if (button) {

      button.innerHTML =
        isLight
          ? '☾'
          : '☀︎';

    }

  }


  function toggleTheme() {

    const isLight =
      document.body.classList.contains('light');


    const newTheme =
      isLight
        ? 'dark'
        : 'light';


    document.body.classList.toggle(
      'light',
      newTheme === 'light'
    );


    localStorage.setItem(
      'nimboTheme',
      newTheme
    );


    const button =
      document.getElementById(
        'themeToggle'
      );


    if (button) {

      button.innerHTML =
        newTheme === 'light'
          ? '☾'
          : '☀︎';

    }

  }

  //endregion


  //region Diagnostic loading

  const params =
    new URLSearchParams(
      window.location.search
    );


  const diagnosticId =
    params.get('id');


  async function loadDiagnostic() {

    if (!diagnosticId) {

      showError(
        'No se ha encontrado el identificador del diagnóstico.'
      );

      return;
    }


    try {

      const response =
        await fetch(
          `${NIMBO_API_URL}/api/diagnostics/` +
          encodeURIComponent(
            diagnosticId
          )
        );


      if (!response.ok) {

        throw new Error(
          'No se ha podido conectar con Nimbo.'
        );
      }


      const result =
        await response.json();


      if (!result.ok) {

        throw new Error(
          result.error ||
          'No se han encontrado los datos.'
        );
      }


      render(
        result.data
      );

    } catch (error) {

      console.error(error);


      showError(
        error.message ||
        'No se han podido cargar los datos.'
      );
    }

  }

  //endregion


  //region Error

  function showError(message) {

    document.getElementById(
      'content'
    ).innerHTML =

      '<p class="loading" style="color:var(--bad);">' +
        message +
      '</p>';
  }

  //endregion


  //region Score colors

  function scoreColor(score) {

    const stops = [

      {
        position:0,
        color:[255,107,107]
      },

      {
        position:50,
        color:[255,193,99]
      },

      {
        position:100,
        color:[95,227,163]
      }

    ];


    const safeScore =
      Math.max(
        0,
        Math.min(
          100,
          Number(score) || 0
        )
      );


    const index =
      safeScore <= 50
        ? 0
        : 1;


    const start =
      stops[index];


    const end =
      stops[index + 1];


    const ratio =
      (safeScore - start.position) /
      (end.position - start.position);


    const red =
      Math.round(
        start.color[0] +
        (end.color[0] - start.color[0]) *
        ratio
      );


    const green =
      Math.round(
        start.color[1] +
        (end.color[1] - start.color[1]) *
        ratio
      );


    const blue =
      Math.round(
        start.color[2] +
        (end.color[2] - start.color[2]) *
        ratio
      );


    return (
      'rgb(' +
      red + ',' +
      green + ',' +
      blue +
      ')'
    );
  }

  //endregion


  //region Render

  function render(data) {

if (
  !data ||
  !data.scores ||
  !data.diagnosis
) {

  showError(
    'No hemos encontrado ese resultado.'
  );

  return;
}


const scores =
  data.scores;


const diagnosis =
  data.diagnosis;


const totalScore =
  Math.round(
    Number(scores.total) || 0
  );

  let diagnosisTitle =
  'Situación financiera equilibrada';


if (diagnosis.status === 'positive') {

  diagnosisTitle =
    'Situación financiera positiva';

} else if (
  diagnosis.status === 'negative'
) {

  diagnosisTitle =
    'Situación financiera vulnerable';
}


const areas = [

  [
    'Gastos',
    Math.round(
      Number(scores.expenses) || 0
    )
  ],

  [
    'Fondo de emergencia',
    Math.round(
      Number(scores.emergency) || 0
    )
  ],

  [
    'Inversión',
    Math.round(
      Number(scores.investment) || 0
    )
  ],

  [
    'Deudas',
    Math.round(
      Number(scores.debt) || 0
    )
  ]

];


const rows =
  areas
    .map(
      function(area) {

        const currentColor =
          scoreColor(
            area[1]
          );


        return (

          '<tr>' +

            '<td>' +

              '<span ' +
                'class="status-dot" ' +
                'style="background:' +
                currentColor +
              '">' +
              '</span>' +

              area[0] +

            '</td>' +

            '<td ' +
              'class="num" ' +
              'style="color:' +
              currentColor +
            '">' +

              area[1] +

            '</td>' +

          '</tr>'

        );

      }
    )
    .join('');


let diagnosisColor =
  'var(--warn)';


if (
  diagnosis.status === 'positive'
) {

  diagnosisColor =
    'var(--good)';

} else if (
  diagnosis.status === 'negative'
) {

  diagnosisColor =
    'var(--bad)';

}


document.getElementById(
  'content'
).innerHTML =


  '<div class="score-card">' +

    '<span class="ring-num">' +
      totalScore +
    '</span>' +

    '<div>' +

      '<div ' +
  'class="score-status" ' +
  'style="color:' +
    diagnosisColor +
  '">' +

  diagnosisTitle +

'</div>' +

      '<div class="score-label">' +
        'de 100 puntos' +
      '</div>' +

    '</div>' +

  '</div>' +


  '<div class="diagnosis-panel">' +

'<div class="diagnosis-title">' +
  'Tu diagnóstico' +
'</div>' +

'<div class="diagnosis-subtitle">' +
  'Qué significa tu resultado en cada área' +
'</div>' +

'<div class="diagnosis-item">' +

  '<div class="diagnosis-label">' +
    'Gastos' +
  '</div>' +

  '<p>' +
    diagnosis.expensesMessage +
  '</p>' +

'</div>' +

'<div class="diagnosis-item">' +

  '<div class="diagnosis-label">' +
    'Fondo de emergencia' +
  '</div>' +

  '<p>' +
    diagnosis.emergencyMessage +
  '</p>' +

'</div>' +

'<div class="diagnosis-item">' +

  '<div class="diagnosis-label">' +
    'Inversión' +
  '</div>' +

  '<p>' +
    diagnosis.investmentMessage +
  '</p>' +

'</div>' +

'<div class="diagnosis-item">' +

  '<div class="diagnosis-label">' +
    'Deudas' +
  '</div>' +

  '<p>' +
    diagnosis.debtMessage +
  '</p>' +

'</div>' +

'</div>' +

  '<div class="panel">' +

    '<h3>Tu desglose completo</h3>' +

    '<table>' +

      '<tbody>' +

        rows +

      '</tbody>' +

    '</table>' +

  '</div>' +


  '<div class="upsell">' +

    '<h3>Lo que Nimbo haría por ti</h3>' +

    '<p>' +

      'Un plan personalizado a partir de tu resultado, con un movimiento concreto cada semana y seguimiento de tu progreso mes a mes.' +

    '</p>' +

    '<ul>' +

      '<li>Plan de acción enfocado en tu situación financiera</li>' +

      '<li>Un movimiento financiero concreto cada semana</li>' +

      '<li>Seguimiento claro de tu evolución</li>' +

    '</ul>' +

    '<a href="register.html" class="cta">' +

      'Crear mi cuenta →' +

    '</a>' +

    '<div class="cta-note">' +

      '¿Ya tienes cuenta? ' +

      '<a href="login.html" style="color:var(--cyan);">' +

        'Iniciar sesión' +

      '</a>' +

    '</div>' +

    '<div class="cta-note">' +

      '9.99 € al año' +

    '</div>' +

    '<div class="code-wrap">' +

      '<div class="code-label">' +

        '¿Tienes un código?' +

      '</div>' +

      '<div class="code-row">' +

        '<input ' +

          'class="code-input" ' +

          'type="text" ' +

          'placeholder="Código" ' +

          'id="codigo" ' +

        '>' +

        '<button ' +

          'class="code-btn" ' +

          'type="button" ' +

          'onclick="applyCode()"' +

        '>' +

          'Aplicar' +

        '</button>' +

      '</div>' +

    '</div>' +

  '</div>';

}

//endregion


  //region Promo code

  function applyCode() {

    const code =
      document
        .getElementById(
          'codigo'
        )
        .value
        .trim();


    if (!code) {

      return;
    }


    alert(
      'Código recibido: ' +
      code +
      '\n(Esto es solo una prueba por ahora)'
    );
  }

  //endregion


  //region Init

  applyTheme();

  loadDiagnostic();

  //endregion

</script>

</body>

</html>
